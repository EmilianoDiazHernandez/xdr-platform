services:
  # =========================================================================
  # 1. ROUTER GATEWAY PRINCIPAL (L3 + ZEEK EN VIVO) - DISPOSITIVO 1
  # =========================================================================
  legit-router-sensor:
    build:
      context: ../../dispositivos/router-sensor
    container_name: xdr-legit-router
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./zeek_logs:/zeek_logs
    networks:
      legit-wan:
        ipv4_address: 185.15.2.1
      legit-dmz:
        ipv4_address: 172.16.0.1
      legit-lan:
        ipv4_address: 10.20.30.1
    restart: unless-stopped
    sysctls:
      - net.ipv4.ip_forward=1

  # =========================================================================
  # SEGMENTO WAN: BORDE EXTERNO (DISPOSITIVOS 2 Y 3)
  # =========================================================================
  # Dispositivo 2: Router de Borde del Proveedor ISP
  legit-router-isp:
    build:
      context: ../../dispositivos/switch
    container_name: xdr-legit-router-isp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - GATEWAY_IP=185.15.2.1
      - DEVICE_HOSTNAME=ROUTER-ISP-WAN
      - DEVICE_IP=185.15.2.3
      - SWITCH_ROLE=BGP Border Router
      - VLAN_ID=1
      - PORT=80
    command: >
      sh -c "
        if [ -n \"$${GATEWAY_IP}\" ]; then
          ip route add 172.16.0.0/24 via $${GATEWAY_IP} 2>/dev/null || true
          ip route add 10.20.30.0/24 via $${GATEWAY_IP} 2>/dev/null || true
        fi
        exec python3 switch_agent.py
      "
    networks:
      legit-wan:
        ipv4_address: 185.15.2.3
    depends_on:
      - legit-router-sensor

  # Dispositivo 3: Cliente / Socio Comercial Externo
  legit-partner-ext:
    build:
      context: ../../dispositivos/attacker
    container_name: xdr-legit-partner-ext
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - GATEWAY_IP=185.15.2.1
      - DEVICE_HOSTNAME=PARTNER-EXT-CLIENT
      - DEVICE_IP=185.15.2.2
    command: >
      sh -c "
        if [ -n \"$${GATEWAY_IP}\" ]; then
          ip route add 172.16.0.0/24 via $${GATEWAY_IP} 2>/dev/null || true
          ip route add 10.20.30.0/24 via $${GATEWAY_IP} 2>/dev/null || true
        fi
        exec uvicorn attack_controller:app --host 0.0.0.0 --port 5000
      "
    networks:
      legit-wan:
        ipv4_address: 185.15.2.2
    depends_on:
      - legit-router-sensor

  # =========================================================================
  # SEGMENTO DMZ: SWITCH Y SERVIDORES EXPUESTOS (DISPOSITIVOS 4 AL 7)
  # =========================================================================
  # Dispositivo 4: Switch de Distribución DMZ
  legit-sw-dmz:
    build:
      context: ../../dispositivos/switch
    container_name: xdr-legit-sw-dmz
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - GATEWAY_IP=172.16.0.1
      - DEVICE_HOSTNAME=SW-DMZ-DISTRIBUTION
      - DEVICE_IP=172.16.0.2
      - SWITCH_ROLE=DMZ Distribution Switch
      - VLAN_ID=20
      - PORT=80
    command: >
      sh -c "
        if [ -n \"$${GATEWAY_IP}\" ]; then
          ip route add 185.15.2.0/24 via $${GATEWAY_IP} 2>/dev/null || true
          ip route add 10.20.30.0/24 via $${GATEWAY_IP} 2>/dev/null || true
        fi
        exec python3 switch_agent.py
      "
    networks:
      legit-dmz:
        ipv4_address: 172.16.0.2
    depends_on:
      - legit-router-sensor

  # Dispositivo 5: Servidor Web Intranet
  legit-web-intranet:
    build:
      context: ../../dispositivos/server-web
    container_name: xdr-legit-web-intranet
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GATEWAY_IP=172.16.0.1
      - DEVICE_HOSTNAME=SRV-DMZ-INTRANET
      - DEVICE_IP=172.16.0.10
      - EDR_COLLECTOR_URL=http://host.docker.internal:8000/api/v1/analyze-endpoint
    command: >
      sh -c "
        if [ -n \"$${GATEWAY_IP}\" ]; then
          ip route add 185.15.2.0/24 via $${GATEWAY_IP} 2>/dev/null || true
          ip route add 10.20.30.0/24 via $${GATEWAY_IP} 2>/dev/null || true
        fi
        exec uvicorn app:app --host 0.0.0.0 --port 80
      "
    networks:
      legit-dmz:
        ipv4_address: 172.16.0.10
    depends_on:
      - legit-router-sensor
      - legit-sw-dmz

  # Dispositivo 6: Servidor Web ERP
  legit-web-erp:
    build:
      context: ../../dispositivos/server-web
    container_name: xdr-legit-web-erp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GATEWAY_IP=172.16.0.1
      - DEVICE_HOSTNAME=SRV-DMZ-ERP
      - DEVICE_IP=172.16.0.11
      - EDR_COLLECTOR_URL=http://host.docker.internal:8000/api/v1/analyze-endpoint
    command: >
      sh -c "
        if [ -n \"$${GATEWAY_IP}\" ]; then
          ip route add 185.15.2.0/24 via $${GATEWAY_IP} 2>/dev/null || true
          ip route add 10.20.30.0/24 via $${GATEWAY_IP} 2>/dev/null || true
        fi
        exec uvicorn app:app --host 0.0.0.0 --port 80
      "
    networks:
      legit-dmz:
        ipv4_address: 172.16.0.11
    depends_on:
      - legit-router-sensor
      - legit-sw-dmz

  # Dispositivo 7: Servidor de Correo Corporativo Exchange
  legit-mail:
    build:
      context: ../../dispositivos/server-mail
    container_name: xdr-legit-mail
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GATEWAY_IP=172.16.0.1
      - DEVICE_HOSTNAME=CORP-MAIL-EXCHANGE
      - DEVICE_IP=172.16.0.20
      - API_URL=http://host.docker.internal:8000/api/v1/analyze-email
    command: >
      sh -c "
        if [ -n \"$${GATEWAY_IP}\" ]; then
          ip route add 185.15.2.0/24 via $${GATEWAY_IP} 2>/dev/null || true
          ip route add 10.20.30.0/24 via $${GATEWAY_IP} 2>/dev/null || true
        fi
        exec python3 smtp_receiver.py
      "
    networks:
      legit-dmz:
        ipv4_address: 172.16.0.20
    depends_on:
      - legit-router-sensor
      - legit-sw-dmz

  # =========================================================================
  # SEGMENTO LAN: SWITCHES Y SERVIDORES INTERNOS (DISPOSITIVOS 8 AL 11)
  # =========================================================================
  # Dispositivo 8: Switch Core LAN (Backbone principal de la red)
  legit-sw-core:
    build:
      context: ../../dispositivos/switch
    container_name: xdr-legit-sw-core
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - GATEWAY_IP=10.20.30.1
      - DEVICE_HOSTNAME=SW-LAN-CORE
      - DEVICE_IP=10.20.30.2
      - SWITCH_ROLE=Core Distribution Switch
      - VLAN_ID=10
      - PORT=80
    command: >
      sh -c "
        if [ -n \"$${GATEWAY_IP}\" ]; then
          ip route add 185.15.2.0/24 via $${GATEWAY_IP} 2>/dev/null || true
          ip route add 172.16.0.0/24 via $${GATEWAY_IP} 2>/dev/null || true
        fi
        exec python3 switch_agent.py
      "
    networks:
      legit-lan:
        ipv4_address: 10.20.30.2
    depends_on:
      - legit-router-sensor

  # Dispositivo 9: Switch de Acceso Departamental LAN
  legit-sw-access:
    build:
      context: ../../dispositivos/switch
    container_name: xdr-legit-sw-access
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - GATEWAY_IP=10.20.30.1
      - DEVICE_HOSTNAME=SW-LAN-ACCESS-01
      - DEVICE_IP=10.20.30.3
      - SWITCH_ROLE=Access Switch
      - VLAN_ID=30
      - PORT=80
    command: >
      sh -c "
        if [ -n \"$${GATEWAY_IP}\" ]; then
          ip route add 185.15.2.0/24 via $${GATEWAY_IP} 2>/dev/null || true
          ip route add 172.16.0.0/24 via $${GATEWAY_IP} 2>/dev/null || true
        fi
        exec python3 switch_agent.py
      "
    networks:
      legit-lan:
        ipv4_address: 10.20.30.3
    depends_on:
      - legit-router-sensor
      - legit-sw-core

  # Dispositivo 10: Base de Datos Transaccional Producción
  legit-db-prod:
    build:
      context: ../../dispositivos/server-db
    container_name: xdr-legit-db-prod
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - GATEWAY_IP=10.20.30.1
      - DEVICE_HOSTNAME=SRV-DB-PROD
      - DEVICE_IP=10.20.30.50
    command: >
      sh -c "
        if [ -n \"$${GATEWAY_IP}\" ]; then
          ip route add 185.15.2.0/24 via $${GATEWAY_IP} 2>/dev/null || true
          ip route add 172.16.0.0/24 via $${GATEWAY_IP} 2>/dev/null || true
        fi
        exec python3 listener.py
      "
    networks:
      legit-lan:
        ipv4_address: 10.20.30.50
    depends_on:
      - legit-router-sensor
      - legit-sw-core

  # Dispositivo 11: Base de Datos Data Warehouse / Analytics
  legit-db-analytics:
    build:
      context: ../../dispositivos/server-db
    container_name: xdr-legit-db-analytics
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - GATEWAY_IP=10.20.30.1
      - DEVICE_HOSTNAME=SRV-DB-ANALYTICS
      - DEVICE_IP=10.20.30.51
    command: >
      sh -c "
        if [ -n \"$${GATEWAY_IP}\" ]; then
          ip route add 185.15.2.0/24 via $${GATEWAY_IP} 2>/dev/null || true
          ip route add 172.16.0.0/24 via $${GATEWAY_IP} 2>/dev/null || true
        fi
        exec python3 listener.py
      "
    networks:
      legit-lan:
        ipv4_address: 10.20.30.51
    depends_on:
      - legit-router-sensor
      - legit-sw-core

  # =========================================================================
  # SEGMENTO LAN: ESTACIONES DE TRABAJO DE USUARIOS (DISPOSITIVOS 12 AL 15)
  # Generan tráfico legítimo continuo hacia DMZ e infraestructura
  # =========================================================================
  # Dispositivo 12: PC Ventas -> Consulta continua a ERP Web
  legit-pc-ventas:
    build:
      context: ../../dispositivos/workstation
    container_name: xdr-legit-pc-ventas
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GATEWAY_IP=10.20.30.1
      - DEVICE_HOSTNAME=PC-VENTAS-01
      - DEVICE_IP=10.20.30.101
      - TARGET_WEB_URL=http://172.16.0.11/
      - AUTO_TRAFFIC=true
      - EDR_COLLECTOR_URL=http://host.docker.internal:8000/api/v1/analyze-endpoint
    command: >
      sh -c "
        if [ -n \"$${GATEWAY_IP}\" ]; then
          ip route add 185.15.2.0/24 via $${GATEWAY_IP} 2>/dev/null || true
          ip route add 172.16.0.0/24 via $${GATEWAY_IP} 2>/dev/null || true
        fi
        exec uvicorn edr_agent:app --host 0.0.0.0 --port 5001
      "
    networks:
      legit-lan:
        ipv4_address: 10.20.30.101
    depends_on:
      - legit-router-sensor
      - legit-sw-access
      - legit-web-erp

  # Dispositivo 13: PC Finanzas -> Consulta continua a ERP Web
  legit-pc-finanzas:
    build:
      context: ../../dispositivos/workstation
    container_name: xdr-legit-pc-finanzas
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GATEWAY_IP=10.20.30.1
      - DEVICE_HOSTNAME=PC-FINANZAS-01
      - DEVICE_IP=10.20.30.103
      - TARGET_WEB_URL=http://172.16.0.11/
      - AUTO_TRAFFIC=true
      - EDR_COLLECTOR_URL=http://host.docker.internal:8000/api/v1/analyze-endpoint
    command: >
      sh -c "
        if [ -n \"$${GATEWAY_IP}\" ]; then
          ip route add 185.15.2.0/24 via $${GATEWAY_IP} 2>/dev/null || true
          ip route add 172.16.0.0/24 via $${GATEWAY_IP} 2>/dev/null || true
        fi
        exec uvicorn edr_agent:app --host 0.0.0.0 --port 5001
      "
    networks:
      legit-lan:
        ipv4_address: 10.20.30.103
    depends_on:
      - legit-router-sensor
      - legit-sw-access
      - legit-web-erp

  # Dispositivo 14: PC Recursos Humanos -> Consulta continua a Intranet
  legit-pc-rrhh:
    build:
      context: ../../dispositivos/workstation
    container_name: xdr-legit-pc-rrhh
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GATEWAY_IP=10.20.30.1
      - DEVICE_HOSTNAME=PC-RRHH-01
      - DEVICE_IP=10.20.30.104
      - TARGET_WEB_URL=http://172.16.0.10/
      - AUTO_TRAFFIC=true
      - EDR_COLLECTOR_URL=http://host.docker.internal:8000/api/v1/analyze-endpoint
    command: >
      sh -c "
        if [ -n \"$${GATEWAY_IP}\" ]; then
          ip route add 185.15.2.0/24 via $${GATEWAY_IP} 2>/dev/null || true
          ip route add 172.16.0.0/24 via $${GATEWAY_IP} 2>/dev/null || true
        fi
        exec uvicorn edr_agent:app --host 0.0.0.0 --port 5001
      "
    networks:
      legit-lan:
        ipv4_address: 10.20.30.104
    depends_on:
      - legit-router-sensor
      - legit-sw-access
      - legit-web-intranet

  # Dispositivo 15: PC TI / Administración -> Consulta continua a Intranet y Servicios
  legit-pc-ti:
    build:
      context: ../../dispositivos/workstation
    container_name: xdr-legit-pc-ti
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GATEWAY_IP=10.20.30.1
      - DEVICE_HOSTNAME=PC-TI-ADMIN
      - DEVICE_IP=10.20.30.105
      - TARGET_WEB_URL=http://172.16.0.10/
      - AUTO_TRAFFIC=true
      - EDR_COLLECTOR_URL=http://host.docker.internal:8000/api/v1/analyze-endpoint
    command: >
      sh -c "
        if [ -n \"$${GATEWAY_IP}\" ]; then
          ip route add 185.15.2.0/24 via $${GATEWAY_IP} 2>/dev/null || true
          ip route add 172.16.0.0/24 via $${GATEWAY_IP} 2>/dev/null || true
        fi
        exec uvicorn edr_agent:app --host 0.0.0.0 --port 5001
      "
    networks:
      legit-lan:
        ipv4_address: 10.20.30.105
    depends_on:
      - legit-router-sensor
      - legit-sw-access
      - legit-web-intranet

  # =========================================================================
  # SERVICIOS DE GESTIÓN Y PIPELINE DE INGESTA
  # =========================================================================
  # Dashboard Orquestador C2 (Expuesto en http://localhost:9000)
  legit-dashboard:
    build:
      context: ../../dashboard
    container_name: xdr-legit-dashboard
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - ATTACKER_URL=http://xdr-legit-partner-ext:5000
      - PARTNER_EXT_URL=http://xdr-legit-partner-ext:5000
      - ROUTER_ISP_URL=http://xdr-legit-router-isp:80
      - WORKSTATION_URL=http://xdr-legit-pc-ventas:5001
      - WORKSTATIONS=http://xdr-legit-pc-ventas:5001,http://xdr-legit-pc-finanzas:5001,http://xdr-legit-pc-rrhh:5001,http://xdr-legit-pc-ti:5001
      - SWITCHES=http://xdr-legit-sw-core:80,http://xdr-legit-sw-access:80,http://xdr-legit-sw-dmz:80
      - SW_DMZ_URL=http://xdr-legit-sw-dmz:80
      - SW_CORE_URL=http://xdr-legit-sw-core:80
      - SW_ACCESS_URL=http://xdr-legit-sw-access:80
      - WEB_INTRANET_URL=http://xdr-legit-web-intranet:80
      - WEB_ERP_URL=http://xdr-legit-web-erp:80
      - WEB_SRV_IP=172.16.0.10
      - WEB_ERP_IP=172.16.0.11
      - MAIL_SRV_IP=172.16.0.20
      - DB_INTERNAL_IP=10.20.30.50
      - DB_ANALYTICS_IP=10.20.30.51
      - ROUTER_GATEWAY_IP=172.16.0.1
      - TOPOLOGY_MODE=15_NODES
    networks:
      legit-wan:
        ipv4_address: 185.15.2.100
      legit-dmz:
        ipv4_address: 172.16.0.100
      legit-lan:
        ipv4_address: 10.20.30.100
    depends_on:
      - legit-partner-ext
      - legit-pc-ventas
      - legit-sw-core

  # Pipeline de Ingesta continuo (Zeek -> API XDR)
  legit-pipeline-adapter:
    build:
      context: ../../pipeline_ingesta
    container_name: xdr-legit-pipeline
    restart: unless-stopped
    volumes:
      - ./zeek_logs:/zeek_logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ZEEK_LOG_PATH=/zeek_logs
      - API_URL=http://host.docker.internal:8000/api/v1/analyze-network
      - BATCH_SIZE=20
      - FLUSH_INTERVAL=1.0
    networks:
      - legit-mgmt
    depends_on:
      - legit-router-sensor

# =========================================================================
# DEFINICIÓN DE SWITCHES VIRTUALES (REDES LAYER 2 AISLADAS)
# =========================================================================
networks:
  legit-wan:
    driver: bridge
    ipam:
      config:
        - subnet: 185.15.2.0/24
          gateway: 185.15.2.254

  legit-dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.0.0/24
          gateway: 172.16.0.254

  legit-lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.30.0/24
          gateway: 10.20.30.254

  legit-mgmt:
    driver: bridge
