services:
  # Motor de ML (Análisis de Tráfico)
  api-ml:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: xdr-api-ml
    ports:
      - "8000:8000"
    command: uvicorn ml.fastAPI:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/src:/app/src
    networks:
      - xdr-network

  # Motor de Reportes (Independiente)
  api-reports:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: xdr-api-reports
    ports:
      - "8001:8001"
    command: uvicorn reports.api:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./backend/src:/app/src
    networks:
      - xdr-network

  # Dashboard (Frontend Web para Desarrollo)
  frontend:
    build:
      context: ./frontend
    container_name: xdr-dashboard
    ports:
      - "3000:3000"
    networks:
      - xdr-network

  # Bases de Datos (Ya existentes en estructura)
  timescaledb:
    build: ./database/timescaledb
    container_name: xdr-db-timescale
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: xdr_db
      POSTGRES_USER: xdr_user
      POSTGRES_PASSWORD: xdr_password
    networks:
      - xdr-network

  neo4j:
    build: ./database/neo4j
    container_name: xdr-db-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/xdr_password
    networks:
      - xdr-network

networks:
  xdr-network:
    driver: bridge
